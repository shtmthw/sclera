name: Go CD Pipeline

on:
    workflow_run:
        workflows: ["Go CI Pipeline"]
        types:
            - completed

jobs:
    deploy-server:
        runs-on: self-hosted
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps: 
        - name: Check Docker username
          run: | 
            echo "Docker username is: ${{ vars.DOCKER_USERNAME }}"
          

        - name: Extract Docker image metadata
          id: meta
          uses: docker/metadata-action@v6
          with: 
            images: matthew552/sclera

        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
           username: ${{ vars.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}      
        
        - name: Build and push Docker image
          uses: docker/build-push-action@v7
          with:
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            annotations: ${{ steps.meta.outputs.annotations }}


        
        #after the image getting pushed to hub, make a docker network, run a container, run a postgreSQL container (if no exists in network)
        #make them talk to eachother and deploy to localhost (my local cloud)