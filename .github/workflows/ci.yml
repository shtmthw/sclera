name: Go CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Go environment
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "GOBIN=$HOME/go/bin" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH
          echo "$HOME/golangci-lint-2.12.2-linux-amd64" >> $GITHUB_PATH

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false   # defaults to $HOME/go/pkg/mod + $HOME/.cache/go-build, already persistent

      - name: Run golangci-lint
        run: golangci-lint run ./...

  vulncheck:
    name: Vulnerability Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Go environment
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "GOBIN=$HOME/go/bin" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install govulncheck (only if missing)
        run: |
          command -v govulncheck >/dev/null 2>&1 || \
            go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test-and-build:
    name: Test and Build
    needs: [lint, vulncheck]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Go environment
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Run Unit Tests
        env:
          CGO_ENABLED: '1'
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build Binary
        env:
          CGO_ENABLED: '1'
        run: go build -v -o dist/main ./cmd/server