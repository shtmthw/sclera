<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  :root {
    --bg: #0d1017;
    --card-bg: #161a24;
    --card-border: #262c3a;
    --text: #f3f4f6;
    --text-muted: #94a3b8;
    --cream: #faf1bd;
    --cream-border: #d8cd8f;
    --green: #4ade80;
    --green-dark: #22c55e;
    --gemma-tag: #7dd3fc;
    --oss-tag: #fbbf7d;
    --error: #f87171;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    overflow: hidden;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* --- Top bar --- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--card-border);
    background: var(--bg);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg {
    width: 16px;
    height: 16px;
    stroke: #0d1017;
  }

  .brand h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* --- Model picker (compact, top-right) --- */
  .model-select {
    position: relative;
  }

  .model-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #12151d;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .model-toggle:hover { border-color: #3a4256; }

  .model-toggle:focus-visible,
  .model-option:focus-visible,
  #msgInput:focus-visible,
  #sendBtn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .model-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gemma-tag);
    flex-shrink: 0;
  }

  .model-toggle[data-model="oss"] .model-dot {
    background: var(--oss-tag);
  }

  .chevron {
    width: 14px;
    height: 14px;
    stroke: var(--text-muted);
    transition: transform 0.15s ease;
  }

  .model-select.open .chevron { transform: rotate(180deg); }

  .model-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 140px;
    background: #12151d;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 30;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }

  .model-menu[hidden] { display: none; }

  .model-option {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }

  .model-option:hover {
    border-color: var(--card-border);
    color: var(--text);
  }

  .model-option.active {
    background: var(--green);
    border-color: var(--green);
    color: #0d1017;
  }

  /* --- Main chat area: fills all remaining height --- */
  .chat-main {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .chat-scroll {
    max-width: 820px;
    margin: 0 auto;
    min-height: 100%;
    padding: 32px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    justify-content: flex-end;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14.5px;
    padding: 40px 20px;
  }

  .empty-state strong {
    display: block;
    color: var(--text);
    font-size: 18px;
    margin-bottom: 6px;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 68%;
  }

  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }
  .msg-row.error { align-self: center; max-width: 90%; }

  .msg-tag {
    font-size: 11.5px;
    font-weight: 600;
    margin-bottom: 4px;
    padding-left: 2px;
    color: var(--text-muted);
  }

  .msg-tag.gemma { color: var(--gemma-tag); }
  .msg-tag.oss { color: var(--oss-tag); }

  .bubble {
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .user-msg {
    background: var(--cream);
    color: #1a1a12;
    border-bottom-right-radius: 4px;
  }

  .bot-msg {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .error-msg {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: var(--error);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    text-align: center;
  }

  /* --- Inline markdown rendering (bot bubbles only) --- */
  .bubble strong { font-weight: 700; color: var(--text); }
  .bubble em { font-style: italic; }

  .bubble code.inline-code {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 1px 6px;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
  }

  .bubble pre.code-block {
    background: #0f1420;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 6px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre;
  }

  .bubble pre.code-block code {
    background: transparent;
    border: none;
    padding: 0;
  }

  .bubble .spoiler {
    background: var(--card-border);
    color: transparent;
    border-radius: 4px;
    padding: 0 3px;
    cursor: pointer;
    transition: color 0.12s ease, background 0.12s ease;
  }

  .bubble .spoiler.revealed {
    background: rgba(255, 255, 255, 0.06);
    color: inherit;
    cursor: text;
  }

  /* --- Typing indicator --- */
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typingPulse 1.2s infinite ease-in-out;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingPulse {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* --- Composer (bottom input bar) --- */
  .composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--card-border);
    background: var(--bg);
    padding: 14px 24px 18px;
  }

  .chat-form {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--cream);
    border: 1px solid var(--cream-border);
    border-radius: 18px;
    padding: 8px 8px 8px 16px;
  }

  #msgInput {
    flex: 1;
    background: transparent;
    border: none;
    color: #1a1a12;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    padding: 10px 0;
    resize: none;
    max-height: 160px;
    overflow-y: auto;
  }

  #msgInput:focus { outline: none; }

  #msgInput::placeholder { color: #8a825a; }

  #sendBtn {
    flex: 0 0 auto;
    background: var(--green);
    border: none;
    border-radius: 14px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.12s ease;
  }

  #sendBtn svg {
    width: 18px;
    height: 18px;
    stroke: #0d1017;
  }

  #sendBtn:hover { background: var(--green-dark); }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }

  .composer-hint {
    max-width: 820px;
    margin: 6px auto 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .chat-scroll { padding: 20px 16px 16px; }
    .composer { padding: 10px 16px 14px; }
    .msg-row { max-width: 85%; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Chat</h1>
    </div>

    <div class="model-select" id="modelSelect">
      <button type="button"
              class="model-toggle"
              id="modelToggle"
              data-model="gemma"
              aria-haspopup="listbox"
              aria-expanded="false">
        <span class="model-dot"></span>
        <span id="modelLabel">Gemma</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="model-menu" id="modelMenu" role="listbox" hidden>
        <button type="button" class="model-option active" data-model="gemma" role="option" aria-selected="true">Gemma</button>
        <button type="button" class="model-option" data-model="oss" role="option" aria-selected="false">OSS</button>
      </div>
    </div>
  </header>

  <main class="chat-main" id="chatMain">
    <div class="chat-scroll" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <strong>Start a conversation</strong>
        Ask anything — pick which model answers from the top right.
      </div>
    </div>
  </main>

  <footer class="composer">
    <form id="chatForm" class="chat-form">
      <textarea id="msgInput" name="userSentMessage" rows="1" autocomplete="off" placeholder="Message..."></textarea>
      <button type="submit" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22 2 11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 2 15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <div class="composer-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for a new line</div>
  </footer>

</div>

<script>
  const ENDPOINTS = {
    gemma: "/gemmaProcessUserSentMessage",
    oss: "/OSSProcessUserSentMessage",
  };

  let selectedModel = "gemma";

  const modelSelect = document.getElementById("modelSelect");
  const modelToggle = document.getElementById("modelToggle");
  const modelMenu = document.getElementById("modelMenu");
  const modelLabel = document.getElementById("modelLabel");
  const modelOptions = modelMenu.querySelectorAll(".model-option");

  function openMenu() {
    modelMenu.hidden = false;
    modelSelect.classList.add("open");
    modelToggle.setAttribute("aria-expanded", "true");
  }

  function closeMenu() {
    modelMenu.hidden = true;
    modelSelect.classList.remove("open");
    modelToggle.setAttribute("aria-expanded", "false");
  }

  modelToggle.addEventListener("click", () => {
    modelMenu.hidden ? openMenu() : closeMenu();
  });

  modelOptions.forEach((opt) => {
    opt.addEventListener("click", () => {
      selectedModel = opt.dataset.model;

      modelOptions.forEach((o) => {
        o.classList.toggle("active", o === opt);
        o.setAttribute("aria-selected", o === opt ? "true" : "false");
      });

      modelLabel.textContent = opt.textContent;
      modelToggle.dataset.model = selectedModel;
      closeMenu();
      msgInput.focus();
    });
  });

  document.addEventListener("click", (e) => {
    if (!modelSelect.contains(e.target)) closeMenu();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });

  // --- Minimal, safe markdown renderer for bot bubbles only ---
  // Escapes raw HTML FIRST, so nothing the model outputs can inject markup —
  // then re-adds only the specific patterns below on top of the escaped text.
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderMarkdown(raw) {
    let text = escapeHtml(raw);

    // ```code blocks``` — must run before inline `code` and **bold**
    text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
      return `<pre class="code-block"><code>${code.trim()}</code></pre>`;
    });

    // `inline code`
    text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');

    // **bold**
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

    // *italic* or _italic_
    text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    text = text.replace(/_([^_]+)_/g, "<em>$1</em>");

    // ||spoiler|| — Discord-style, click to reveal
    text = text.replace(
      /\|\|([\s\S]+?)\|\|/g,
      '<span class="spoiler" role="button" tabindex="0" aria-label="Spoiler, click to reveal">$1</span>'
    );

    return text;
  }

  // Click OR keyboard-activate a spoiler to reveal it (event delegation,
  // since spoilers are added dynamically after the page has loaded)
  function wireSpoilerReveal(container) {
    container.addEventListener("click", (e) => {
      const el = e.target.closest(".spoiler");
      if (el) el.classList.toggle("revealed");
    });
    container.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest(".spoiler");
      if (el) {
        e.preventDefault();
        el.classList.toggle("revealed");
      }
    });
  }

  // --- Chat elements ---
  const chatForm = document.getElementById("chatForm");
  const chatWindow = document.getElementById("chatWindow");
  const chatMain = document.getElementById("chatMain");
  const sendBtn = document.getElementById("sendBtn");
  const msgInput = document.getElementById("msgInput");
  const emptyState = document.getElementById("emptyState");

  wireSpoilerReveal(chatWindow);

  function clearEmptyState() {
    if (emptyState && emptyState.parentNode) emptyState.remove();
  }

  function scrollToBottom() {
    chatMain.scrollTop = chatMain.scrollHeight;
  }

  function appendUserMessage(text) {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `<div class="bubble user-msg"></div>`;
    // User's own input is shown verbatim — no markdown parsing on this side.
    row.querySelector(".bubble").textContent = text;
    chatWindow.appendChild(row);
  }

  function appendTypingIndicator(model) {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typingRow";
    const tagText = model === "oss" ? "OSS" : "Gemma";
    const tagClass = model === "oss" ? "oss" : "gemma";
    row.innerHTML = `
      <div class="msg-tag ${tagClass}">${tagText}</div>
      <div class="bubble bot-msg">
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>`;
    chatWindow.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  function appendBotMessage(text, model) {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    const tagText = model === "oss" ? "OSS" : "Gemma";
    const tagClass = model === "oss" ? "oss" : "gemma";
    row.innerHTML = `<div class="msg-tag ${tagClass}">${tagText}</div><div class="bubble bot-msg"></div>`;
    // Bot output goes through the safe markdown renderer, not raw textContent.
    row.querySelector(".bubble").innerHTML = renderMarkdown(text);
    chatWindow.appendChild(row);
  }

  function appendErrorMessage(text) {
    const row = document.createElement("div");
    row.className = "msg-row error";
    row.innerHTML = `<div class="error-msg"></div>`;
    row.querySelector(".error-msg").textContent = text;
    chatWindow.appendChild(row);
  }

  // Auto-grow the textarea as the user types, capped by max-height in CSS
  msgInput.addEventListener("input", () => {
    msgInput.style.height = "auto";
    msgInput.style.height = msgInput.scrollHeight + "px";
  });

  // Enter sends, Shift+Enter inserts a newline
  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      chatForm.requestSubmit();
    }
  });

  async function sendMessage(message) {
    const formData = new URLSearchParams();
    formData.append("userSentMessage", message);

    const endpoint = ENDPOINTS[selectedModel];
    const modelAtSendTime = selectedModel;

    appendTypingIndicator(modelAtSendTime);

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData,
      });

      removeTypingIndicator();

      if (!res.ok) {
        const errText = await res.text();
        appendErrorMessage(`Error: ${errText}`);
        scrollToBottom();
        return;
      }

      const data = await res.json();
      appendBotMessage(data.reply, modelAtSendTime);
      scrollToBottom();
    } catch (err) {
      removeTypingIndicator();
      appendErrorMessage(`Request failed: ${err}`);
      scrollToBottom();
    }
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const message = msgInput.value.trim();
    if (!message) return;

    appendUserMessage(message);
    msgInput.value = "";
    msgInput.style.height = "auto";
    scrollToBottom();

    sendBtn.disabled = true;
    msgInput.focus();

    await sendMessage(message);

    sendBtn.disabled = false;
    msgInput.focus();
  });
</script>

</body>
</html>
