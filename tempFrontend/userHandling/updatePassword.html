<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Password</title>
<style>
  /* Same design tokens as verify-otp.html — kept identical on purpose so
     this reads as the next step of the same flow, not a different app. */
  :root {
    --ink: #10131A;
    --ink-raised: #171B24;
    --hairline: #262B36;
    --text: #EDEFF3;
    --text-dim: #8B92A3;
    --signal: #35D68C;
    --signal-dim: #1F8C5C;
    --error: #E5636B;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    padding: 24px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .card {
    width: 100%;
    max-width: 380px;
    animation: rise 420ms ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--ink-raised);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .mark svg { width: 18px; height: 18px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  .sub {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 28px;
    max-width: 34ch;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 16px;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    background: var(--ink-raised);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  input[type="password"]:focus {
    border-color: var(--signal-dim);
    box-shadow: 0 0 0 3px rgba(53, 214, 140, 0.15);
  }

  input[type="password"].error {
    border-color: var(--error);
  }

  /* ---------- Status line: shares the same is-error pattern as verify-otp.html ---------- */
  .status {
    min-height: 20px;
    font-size: 13px;
    margin: 4px 0 20px;
  }

  .status .error-text {
    color: var(--error);
    display: none;
  }

  .status.is-error .error-text {
    display: inline;
  }

  button.submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--signal);
    color: #0A1510;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 140ms ease, transform 80ms ease;
  }

  button.submit:not(:disabled):active { transform: scale(0.99); }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="card">
verifyLogin
  <div class="mark">
    <!-- same shield/check mark used on the OTP step -->
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3z" stroke="#35D68C" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8.5 12l2.4 2.4L15.5 9.5" stroke="#35D68C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account. Make sure both fields match.</p>

  <!-- Still a plain native form POST to /runPasswordUpdation, same as
       before — nothing about the submission mechanism changed, only the
       styling and a JS check that runs before the browser is allowed to
       actually send it. -->
  <form id="passwordForm" action="/runPasswordUpdation" method="POST" novalidate>

    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="newPassword" required>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="password" required>
    </div>

    <div class="status" id="status">
      <span class="error-text" id="errorText">Passwords do not match.</span>
    </div>

    <button type="submit" class="submit">Update password</button>
  </form>

</div>

<script>
  const form = document.getElementById('passwordForm');
  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');
  const statusEl = document.getElementById('status');
  const errorTextEl = document.getElementById('errorText');

  function showError(message) {
    errorTextEl.textContent = message;
    statusEl.classList.add('is-error');
    newPassword.classList.add('error');
    confirmPassword.classList.add('error');
  }

  function clearError() {
    statusEl.classList.remove('is-error');
    newPassword.classList.remove('error');
    confirmPassword.classList.remove('error');
  }

  // clear the error the moment either field changes, so a corrected value
  // doesn't sit there still marked as wrong
  newPassword.addEventListener('input', clearError);
  confirmPassword.addEventListener('input', clearError);

  form.addEventListener('submit', (e) => {
    // This is the ONLY thing this script actually does: block the native
    // POST if the two fields don't match. Nothing about how the form is
    // sent changes — if this check passes, the browser submits it exactly
    // as it would have with no JS involved at all (form action/method
    // unchanged, still a normal application/x-www-form-urlencoded POST
    // to /runPasswordUpdation).
    if (newPassword.value !== confirmPassword.value) {
      e.preventDefault();
      showError('Passwords do not match.');
      confirmPassword.focus();
      return;
    }

    if (newPassword.value.length === 0) {
      // required attribute already blocks this in practice, but this
      // covers it explicitly in case a browser's built-in validation
      // is bypassed somehow (e.g. autofill edge cases)
      e.preventDefault();
      showError('Password cannot be empty.');
      return;
    }

    // matches — let the form submit natively, no fetch, no preventDefault
  });
</script>

</body>
</html>
