services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - testNet
    volumes:
      - ./searxng/core-config/:/etc/searxng/
      - core-data:/var/cache/searxng/

volumes:
  core-data:

networks:
  testNet:
    external: true